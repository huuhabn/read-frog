<!doctype html>
<html lang="en" data-theme="default" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side Panel | Workmate AI</title>
    <script>
      ;(() => {
        const root = document.documentElement
        let value = null
        try {
          value = JSON.parse(localStorage.getItem("workmate-theme-v1"))
        } catch {}
        const mode = value?.version === 1 ? value.mode : "system"
        const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        root.dataset.theme = value?.theme === "default" ? value.theme : "default"
        root.classList.toggle("dark", dark)
        root.classList.toggle("theme-scaled", value?.version === 1 && value.scaled === true)
        root.style.colorScheme = dark ? "dark" : "light"
      })()
    </script>
    <meta name="manifest.open_at_install" content="false" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
